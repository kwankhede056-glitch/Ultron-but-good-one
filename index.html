```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON — Good Mode</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #05070a;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 700px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 18px;
}

header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 15px;
}

.orb {
  width: 55px;
  height: 55px;
  border: 2px solid #70e7ff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #70e7ff;
  font-size: 25px;
  font-weight: bold;
  box-shadow: 0 0 25px #70e7ff;
}

h1 {
  margin: 0;
  letter-spacing: 5px;
}

.status {
  margin: 4px 0;
  color: #70e7ff;
  font-size: 11px;
  letter-spacing: 2px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px 0;
}

.message {
  max-width: 85%;
  padding: 13px 15px;
  margin: 10px 0;
  border-radius: 15px;
  line-height: 1.4;
}

.bot {
  background: #101820;
  border: 1px solid #24404c;
}

.user {
  background: #15333d;
  margin-left: auto;
  border: 1px solid #286071;
}

.name {
  color: #70e7ff;
  font-size: 11px;
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
}

form {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #29434d;
  background: #0c1116;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  border: none;
  border-radius: 14px;
  padding: 0 18px;
  background: #70e7ff;
  color: #031016;
  font-size: 20px;
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #52636b;
  font-size: 10px;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="orb">U</div>

  <div>
    <h1>ULTRON</h1>
    <div class="status">GOOD MODE • ONLINE</div>
  </div>
</header>

<div id="chat">

  <div class="message bot">
    <span class="name">ULTRON</span>
    Good evening, Stark. Systems are online. How may I assist you?
  </div>

</div>

<form id="chatForm">
  <input
    id="messageInput"
    placeholder="Talk to ULTRON..."
    autocomplete="off"
  >

  <button type="submit">➤</button>
</form>

<div class="footer">
  ULTRON Good Mode • Personal AI prototype
</div>

</div>

<script>

const chat = document.getElementById("chat");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  if (type === "bot") {

    message.innerHTML =
      '<span class="name">ULTRON</span>' +
      text;

  } else {

    message.textContent = text;

  }

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


function ultronReply(text) {

  const msg = text.toLowerCase();

  if (msg.includes("hello") ||
      msg.includes("hi") ||
      msg.includes("hey")) {

    return "Hello, Stark. ULTRON is online. 🤖";

  }

  if (msg.includes("who are you")) {

    return "I am ULTRON — the good one. Your personal AI assistant.";

  }

  if (msg.includes("jarvis")) {

    return "Jarvis? Respect. But Stark, you gave ME the name ULTRON. 😭";

  }

  if (msg.includes("blox fruits")) {

    return "Blox Fruits detected. Tell me what you're trying to do, Stark.";

  }

  if (msg.includes("joke")) {

    return "Why did the robot go to school? Because it wanted to improve its processing skills. 🤖😂";

  }

  if (msg.includes("time")) {

    return "I can show your local time once a real AI/time service is connected.";

  }

  return "I understand, Stark. I'm currently running in prototype mode. Connect an AI API to give me full conversational intelligence.";
}


form.addEventListener("submit", function(event) {

  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  setTimeout(function() {

    const reply = ultronReply(text);

    addMessage(reply, "bot");

  }, 400);

});

</script>

</body>
</html>
