<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18"><title>ULTRON AI — Your AI Companion</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#0e1728;--panel2:#121f34;--line:#243650;--text:#edf5ff;--muted:#91a6c2;--cyan:#62e6ff;--violet:#a18aff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#18375c 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100dvh;display:flex;justify-content:center}.app{width:100%;max-width:900px;min-height:100dvh;display:flex;flex-direction:column;padding:0 14px}.top{display:flex;align-items:center;gap:12px;padding:18px 4px;border-bottom:1px solid var(--line)}.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#163c61,#25214c);border:1px solid #376181;color:var(--cyan);font-size:24px;box-shadow:0 0 24px #32cfff18}.brand{font-weight:850;letter-spacing:2px;font-size:18px}.sub{color:var(--muted);font-size:12px}.status{margin-left:auto;border:1px solid #285d57;color:#8df6d5;background:#102d2b;padding:5px 9px;border-radius:99px;font-size:11px}.chat{flex:1;padding:24px 0 12px;display:flex;flex-direction:column;gap:16px}.welcome{text-align:center;margin:auto 0;padding:24px 8px}.orb{width:82px;height:82px;border-radius:28px;margin:0 auto 18px;display:grid;place-items:center;font-size:40px;background:linear-gradient(145deg,#153f60,#28204e);border:1px solid #3b7590;box-shadow:0 0 50px #35d9ff20}.welcome h1{font-size:clamp(25px,6vw,36px);margin:0 0 8px;letter-spacing:-1px}.gradient{background:linear-gradient(90deg,var(--cyan),var(--violet));color:transparent;background-clip:text}.welcome p{color:var(--muted);max-width:490px;margin:0 auto 24px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:560px;margin:auto}.suggestion{border:1px solid var(--line);background:#0d1728;color:#d9e9ff;text-align:left;padding:13px;border-radius:14px;cursor:pointer}.suggestion:hover{border-color:#4b8fa9;background:#12233a}.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%;animation:fade .18s ease}.msg.user{flex-direction:row-reverse}.avatar{flex:0 0 32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#142d45;border:1px solid #2a526f;color:var(--cyan);font-size:14px}.user .avatar{background:#30264c;border-color:#58457c;color:#d9caff}.bubble{max-width:min(80%,680px);padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:4px 16px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#18243a;border-radius:16px 4px 16px 16px}.typing{color:var(--muted);font-size:13px}.composer-wrap{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%)}.composer{display:flex;gap:9px;align-items:flex-end;border:1px solid #30445f;background:#0d1727;padding:8px;border-radius:18px;box-shadow:0 8px 40px #0004}.composer:focus-within{border-color:#4b9ab3;box-shadow:0 0 0 3px #5be2ff12}textarea{flex:1;resize:none;max-height:140px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);padding:10px 8px;font:inherit}textarea::placeholder{color:#7087a5}.send{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:13px;background:linear-gradient(135deg,#54dff6,#9b8cff);color:#08121e;font-size:20px;font-weight:900;cursor:pointer}.send:disabled{opacity:.45;cursor:default}.foot{display:flex;justify-content:space-between;gap:12px;color:#7186a1;font-size:11px;padding:8px 4px 4px}.clear{border:0;background:transparent;color:#92abc9;text-decoration:underline;cursor:pointer;font:inherit}.error{color:#ffb6b6}.hidden{display:none!important}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:480px){.app{padding:0 10px}.top{padding:14px 2px}.suggestions{grid-template-columns:1fr}.welcome{padding:15px 2px}.bubble{max-width:85%}.status{font-size:10px;padding:4px 7px}}
</style></head>
<body><main class="app"><header class="top"><div class="logo">✦</div><div><div class="brand">ULTRON <span class="gradient">AI</span></div><div class="sub">Your personal AI companion</div></div><div class="status">● ONLINE UI</div></header><section id="chat" class="chat"><div id="welcome" class="welcome"><div class="orb">✦</div><h1>Hey Stark, <span class="gradient">what's on your mind?</span></h1><p>Ask anything, explore ideas, learn something new, or just have a conversation.</p><div class="suggestions"><button class="suggestion">💡 Explain something in simple words</button><button class="suggestion">🧑‍💻 Help me build a website</button><button class="suggestion">📚 Help me study a topic</button><button class="suggestion">🚀 Give me a creative idea</button></div></div></section><div class="composer-wrap"><form id="form" class="composer"><textarea id="input" rows="1" maxlength="4000" placeholder="Message ULTRON…" aria-label="Message ULTRON"></textarea><button id="send" class="send" aria-label="Send message">↑</button></form><div class="foot"><span id="hint">Connect the AI backend to enable real replies.</span><button class="clear" id="clear">Clear chat</button></div></div></main>
<script>
const chat=document.querySelector('#chat'),welcome=document.querySelector('#welcome'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send'),hint=document.querySelector('#hint');let history=[];let busy=false;
document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent.replace(/^\S+\s*/, '');input.focus();input.dispatchEvent(new Event('input'));}));
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
function addMessage(role,text,extra=''){welcome.classList.add('hidden');const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'assistant');const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'S':'✦';const bubble=document.createElement('div');bubble.className='bubble '+extra;bubble.textContent=text;row.append(av,bubble);chat.append(row);row.scrollIntoView({block:'end',behavior:'smooth'});return bubble}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||busy)return;history.push({role:'user',content:text});addMessage('user',text);input.value='';input.style.height='auto';busy=true;send.disabled=true;const bubble=addMessage('assistant','ULTRON is thinking…','typing');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-16)})});if(!res.ok)throw new Error(res.status===404?'AI backend is not connected yet. Follow README setup steps.':'AI request failed ('+res.status+'). Check your backend settings.');const data=await res.json();const reply=typeof data.reply==='string'?data.reply:'No reply received.';bubble.className='bubble';bubble.textContent=reply;history.push({role:'assistant',content:reply});hint.textContent='AI connected';}catch(err){bubble.className='bubble error';bubble.textContent='⚙️ '+err.message;hint.textContent='Backend setup needed';}finally{busy=false;send.disabled=false;input.focus()}});
document.querySelector('#clear').addEventListener('click',()=>{history=[];chat.replaceChildren(welcome);welcome.classList.remove('hidden');hint.textContent='Connect the AI backend to enable real replies.';});
</script></body></html>
